<!doctype html>
<html lang="en">
    <head>
        <script>document.documentElement.dataset.theme = localStorage.getItem("calendar-theme") === "light" ? "light" : "dark";</script>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)" />
        <title>Incident Relay</title>
        <style>
            html, body, #root { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
            body { background: #131314; }
            html[data-theme="light"] body, html[data-theme="light"] .initial-calendar-boot { background: #f8fafd; }
            html[data-theme="light"] .initial-calendar-boot { color: #3c4043; }
            .initial-calendar-boot { display: grid; position: fixed; inset: 0; place-content: center; gap: 24px; background: #131314; color: #e3e3e3; font-family: Arial, sans-serif; }
            .initial-calendar-brand { display: flex; align-items: center; gap: 13px; font-size: 25px; }
            .initial-calendar-mark { display: grid; position: relative; width: 44px; height: 44px; overflow: hidden; place-items: center; border-radius: 5px; background: linear-gradient(135deg, #4285f4 0 72%, #1967d2 72%); color: #fff; font-size: 19px; box-shadow: inset 0 -5px 0 #34a853; }
            .initial-calendar-mark::before { position: absolute; top: 0; right: 0; left: 0; height: 10px; background: #ea4335; content: ""; }
            .initial-calendar-mark::after { position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; background: #fbbc04; content: ""; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
            .initial-calendar-progress { width: 154px; height: 3px; margin: 0 auto; overflow: hidden; border-radius: 2px; background: #394457; }
            .initial-calendar-progress::after { display: block; width: 42%; height: 100%; border-radius: inherit; background: #8ab4f8; content: ""; animation: initial-progress 900ms ease-in-out infinite; }
            @keyframes initial-progress { 0% { transform: translateX(-110%) scaleX(.75); } 50% { transform: translateX(95%) scaleX(1.15); } 100% { transform: translateX(310%) scaleX(.7); } }
            @media (prefers-reduced-motion: reduce) { .initial-calendar-progress::after { animation: none; transform: translateX(70%); } }
        </style>
    </head>
    <body>
        <div id="root"><main class="initial-calendar-boot" aria-hidden="true"><div class="initial-calendar-brand"><span class="initial-calendar-mark">31</span><span>Incident Relay</span></div><div class="initial-calendar-progress"></div></main></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
